# Render Blueprint: servidor Boleia (Express + Socket.IO)
# Base de dados: Neon (PostgreSQL), indicada em DATABASE_URL.
# No Render: New > Blueprint > escolher este repositório. Depois preencher as variáveis secretas.
services:
  - type: web
    name: boleia-server
    runtime: node
    plan: free
    region: frankfurt
    rootDir: server
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22.12.0"
      - key: GOOGLE_ROUTES_API_KEY
        sync: false
      - key: GOOGLE_PLACES_API_KEY
        sync: false
      # Endereço da base de dados Neon (formato postgres:// ou jdbc:postgresql://)
      - key: DATABASE_URL
        sync: false
      # Chave do Google Maps para o site (limitada ao domínio da Vercel; ver DEPLOY.md)
      - key: GOOGLE_MAPS_WEB_KEY
        sync: false
      # Opcionais (preços): FUEL_GASOLINA_MZN, FUEL_GASOLEO_MZN, FUEL_FONTE,
      # PLATFORM_FEE (0.12), SERVICE_FEE (10), DRIVER_MIN_HOURLY (300), ROUTES_TRAFFIC
